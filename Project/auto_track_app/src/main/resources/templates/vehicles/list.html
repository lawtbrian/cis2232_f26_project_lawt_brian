
<!DOCTYPE html>
<!--
    Project: Auto Track - Vehicle Cost & Maintenance Manager
    Course: CIS-2232
    Sprint: 3 - MVC, CRUD, JPA, and Validation
    File: list.html
    Author: Brian Lawt
    Date: November 18, 2026

    Purpose:
    Displays all vehicles retrieved from the database
    using Spring MVC, Thymeleaf, and Spring Data JPA.
-->

<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Auto Track - Vehicle List</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
        }

        header {
            background-color: #142d4e;
            color: white;
            padding: 20px;
            text-align: center;
        }

        main {
            padding: 30px;
        }

        h2 {
            color: #142d4e;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }

        th {
            background-color: #142d4e;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        .button {
            display: inline-block;
            background-color: #142d4e;
            color: white;
            padding: 10px 15px;
            text-decoration: none;
            border-radius: 5px;
            margin-bottom: 20px;
        }


        .delete-button {
            background-color: #b3261e;
            color: white;
            border: none;
            padding: 7px 12px;
            border-radius: 4px;
            cursor: pointer;
            margin-left: 10px;
        }

        .delete-button:hover {
            background-color: #8c1d18;
        }
    </style>
</head>

<body>

<header>
    <h1>Auto Track</h1>
    <p>Vehicle Cost & Maintenance Manager</p>
</header>

<main>

    <h2>Vehicle List</h2>

    <a class="button" th:href="@{/vehicles/add}">
        Add New Vehicle
    </a>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Make</th>
            <th>Model</th>
            <th>Year</th>
            <th>Mileage</th>
            <th>Asking Price</th>
            <th>Market Value</th>
            <th>Total Cost</th>
            <th>Potential Difference</th>
            <th>Actions</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="vehicle : ${vehicles}">
            <td th:text="${vehicle.vehicleId}"></td>
            <td th:text="${vehicle.make}"></td>
            <td th:text="${vehicle.model}"></td>
            <td th:text="${vehicle.year}"></td>
            <td th:text="${vehicle.mileage}"></td>
            <td th:text="${vehicle.askingPrice}"></td>
            <td th:text="${vehicle.marketValue}"></td>
            <td th:text="${vehicle.totalEstimatedCost}"></td>
            <td th:text="${vehicle.potentialDifference}"></td>


            <td>
                <a th:href="@{/vehicles/edit/{id}(id=${vehicle.vehicleId})}">
                    Edit
                </a>

                <form th:action="@{/vehicles/delete/{id}(id=${vehicle.vehicleId})}"
                      method="post"
                      style="display: inline;"
                      onsubmit="return confirm('Are you sure you want to delete this vehicle?');">

                    <button type="submit" class="delete-button">
                        Delete
                    </button>

                </form>
            </td>

        </tr>

        <tr th:if="${#lists.isEmpty(vehicles)}">
            <td colspan="10">
                No vehicles found.
            </td>
        </tr>
        </tbody>
    </table>

</main>

</body>
</html>
